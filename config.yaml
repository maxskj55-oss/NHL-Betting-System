# Settings only. Secrets come from environment variables (GitHub Secrets):
# ODDS_API_KEY, GOOGLE_SERVICE_ACCOUNT_JSON, SHEET_ID.

odds_api:
  base_url: https://api.the-odds-api.com/v4
  sport: icehockey_nhl
  markets: [h2h, spreads, totals]
  bookmakers: [fanduel, pinnacle]   # up to 10 bookmakers count as 1 region
  odds_format: american
  timeout_seconds: 20

nhl_api:
  # Unofficial NHL web API: no key, no credits. Endpoints can change without notice.
  base_url: https://api-web.nhle.com/v1
  timeout_seconds: 20

budget:
  # Fail before a pull if x-requests-used + this pull's cost would exceed this.
  monthly_credits: 300

slate:
  # "Tonight" = now until this hour (local time) the next morning.
  timezone: America/New_York
  window_end_hour_local: 6

output:
  sink: sheets                       # sheets = Google Sheet + CSV backup; csv = CSV only
  sheet_tab: Odds_Snapshots
  csv_path: output/odds_snapshots.csv
  raw_dir: output/raw                # raw API responses, kept for new fixtures

fixtures:
  events: tests/fixtures/events_sample.json
  odds: tests/fixtures/odds_sample.json

pricing:
  # Step 3 (CLAUDE.md "Math"). Pinnacle no-vig baseline -> EV of FanDuel's price.
  # auto_lean: "bet candidate" at or above this EV, "lean" above 0, "pass" at 0 or below.
  bet_candidate_min_ev: 0.03
  # stake_units (a sheet formula on adjusted_ev): first band reached, highest first.
  # Below the lowest band = 0 units (leans and passes). Every band must be at or
  # above bet_candidate_min_ev so a lean never gets a stake.
  stake_bands:
    - {min_ev: 0.08, units: 1.0}
    - {min_ev: 0.05, units: 0.75}
    - {min_ev: 0.03, units: 0.5}
  max_units: 1.5

morning:
  # Daily NHL job (step 2): Tonight, Results, Game_Map. Uses no Odds API credits.
  tonight_tab: Tonight
  archive_tab: Tonight_Archive       # past days' Tonight rows move here (append only)
  results_tab: Results
  game_map_tab: Game_Map             # Odds API event id -> NHL game_id (append only)
  results_lookback_days: 3           # settle any final game this many days back not yet in Results
  match_tolerance_hours: 3           # Odds API commence_time vs NHL startTimeUTC
  csv_dir: output/morning            # CSV copy of what each run wrote
  raw_dir: output/raw_nhl            # raw NHL responses, kept for new fixtures
  fixtures_dir: tests/fixtures/nhl   # used by --dry-run

grading:
  # Step 4. Picks and Parlays are written by the nightly picker (Claude, then Max);
  # code creates them with their headers if missing and otherwise only reads them.
  # Pick_Grades is code's: one row per graded item, appended by the morning job.
  picks_tab: Picks
  parlays_tab: Parlays
  grades_tab: Pick_Grades

closing:
  # Evening closing-snapshot job (manual start; closing.yml).
  minutes_before_start: 15        # pull this long before each start-time group
  handoff_after_minutes: 330      # past ~5.5 h of run time, start a fresh run for the rest
  max_handoffs: 2                 # at most 2 fresh runs per night (3 runs x 5.5 h)
  # A group is pulled only if it has a Picks row or a Tonight row with one of these.
  qualifying_leans: ["bet candidate", "lean"]
