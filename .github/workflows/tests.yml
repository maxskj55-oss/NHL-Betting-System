name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: no surprise OS upgrades
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Dry run
        run: python -m nhl_betting.pull_odds --dry-run
      - name: Mismatch report dry run
        run: python -m nhl_betting.mismatch_report --dry-run
      - name: Morning job dry run
        run: python -m nhl_betting.morning --dry-run
      - name: Closing job dry run
        run: python -m nhl_betting.closing --dry-run
