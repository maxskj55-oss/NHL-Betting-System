name: Save NHL fixtures

# Manual only. Downloads raw NHL /v1/score responses for a date range so they can
# become test fixtures (tests/fixtures/nhl/). Free: no key, no Odds API credits.
# The files are uploaded as an artifact and also pushed to a throwaway branch
# (fixtures/nhl-<run id>) so they can be fetched with git; main is not touched.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date (YYYY-MM-DD, ET schedule date)"
        required: true
      end:
        description: "Last date (YYYY-MM-DD)"
        required: true

permissions:
  contents: write   # only to push the fixtures/nhl-<run id> branch

jobs:
  save:
    runs-on: ubuntu-24.04  # pinned: no surprise OS upgrades
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Save
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python -m nhl_betting.save_nhl_fixtures "$START" "$END"
      - uses: actions/upload-artifact@v7
        with:
          name: nhl-fixtures-${{ github.run_id }}
          path: output/nhl_fixtures/
          retention-days: 30
      - name: Push to a fixtures branch
        run: |
          branch="fixtures/nhl-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -f output/nhl_fixtures/
          git commit -q -m "NHL fixtures ${{ inputs.start }} to ${{ inputs.end }}"
          git push origin "$branch"
