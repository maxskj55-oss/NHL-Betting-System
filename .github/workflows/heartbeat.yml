name: Heartbeat

# GitHub disables scheduled workflows in a public repo after 60 days without
# repository activity. This weekly commit to main counts as activity, so the
# morning job keeps running. It changes only .github/heartbeat.txt.
on:
  schedule:
    - cron: "23 13 * * 1"   # Mondays, about 9:23 am ET (8:23 am in winter)
  workflow_dispatch:

permissions:
  contents: write   # to push the heartbeat commit

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-24.04  # pinned: no surprise OS upgrades
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Commit heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit -q -m "Heartbeat: keep scheduled workflows enabled [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
