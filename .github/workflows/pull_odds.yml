name: Pull odds

# Manual only: Max asks Claude (or presses "Run workflow" in Actions). No schedule.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: saved fixtures, no API calls, no credits"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pull-odds
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-24.04  # pinned: no surprise OS upgrades
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests (no pull if these fail)
        run: python -m pytest -q

      - name: Pull odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -m nhl_betting.pull_odds $DRY_RUN

      # Backup CSV + raw API response (raw files can become tests/fixtures/real/ fixtures).
      - name: Upload snapshot CSV and raw response
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odds-snapshots-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 90
